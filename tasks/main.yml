---
- name: Ensure destination for compose file exists
  ansible.builtin.file:
    path: "{{ docker_compose_generator_output_path }}"
    owner: "{{ docker_compose_generator_uid }}"
    group: "{{ docker_compose_generator_gid }}"
    state: directory

- name: Ensure appdata directory exists
  ansible.builtin.file:
    path: "{{ appdata_path }}"
    owner: "{{ docker_compose_generator_uid }}"
    group: "{{ docker_compose_generator_gid }}"
    state: directory

- name: Find all compose files
  ansible.builtin.set_fact:
    compose_files: >-
      {{
        query('filetree', services_directory +
          (docker_compose_hostname | default(inventory_hostname))) |
        selectattr('state', 'eq', 'file') |
        selectattr('path', 'regex', 'compose.ya?ml$') |
        list
      }}

- name: Build combined compose content
  ansible.builtin.set_fact:
    combined_compose: |
      # Generated by ironicbadger.docker-compose-generator
      # badger badger badger mushroom mushrooooom...

      services:
      {% for file in compose_files | sort(attribute='src') %}
      {% set service_name = file.src | dirname | basename %}
      {% if service_name not in (disabled_compose_files | default([])) %}
      {{ lookup('template', file.src)
         | regex_replace('^(---|services:)\s*\n*', '')
         | regex_replace('^', '  ') }}
      {% endif %}
      {% endfor %}
      {% if FEATURE_DOCKER_IPV6 | default(false) %}

      networks:
        default:
          enable_ipv6: true
      {% endif %}

- name: Write combined compose file
  ansible.builtin.copy:
    content: "{{ combined_compose }}"
    dest: "{{ docker_compose_generator_output_path }}/compose.yaml"
    owner: "{{ docker_compose_generator_uid }}"
    group: "{{ docker_compose_generator_gid }}"

- name: Find all non-compose.yaml files
  ansible.builtin.set_fact:
    non_compose_files: >-
      {{
        query('filetree', services_directory +
          (docker_compose_hostname | default(inventory_hostname))) |
        selectattr('state', 'eq', 'file') |
        rejectattr('path', 'regex', 'compose.ya?ml$') |
        list
      }}

- name: Debug non-compose files (optional)
  ansible.builtin.debug:
    var: non_compose_files

- name: Make sure destination dir exists for non-compose files
  ansible.builtin.file:
    path: "{{ appdata_path }}/{{ item.path | dirname }}"
    owner: "{{ docker_compose_generator_uid }}"
    group: "{{ docker_compose_generator_gid }}"
    state: directory
  loop: "{{ non_compose_files }}"

- name: Copy non-compose files to destination
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ appdata_path }}/{{ item.path }}"
    owner: "{{ docker_compose_generator_uid }}"
    group: "{{ docker_compose_generator_gid }}"
    mode: preserve
  loop: "{{ non_compose_files }}"

- name: Make sure specified directories exist with correct owner
  ansible.builtin.file:
    path: "{{ appdata_path }}/{{ item.path }}"
    owner: "{{ docker_compose_generator_uid }}"
    group: "{{ docker_compose_generator_gid }}"
    state: directory
  loop: "{{ SERVICES_CREATE_DIRS_WITH_OWNER }}"

- name: Make sure destination dir exists for encrypted service files
  ansible.builtin.file:
    path: "{{ appdata_path }}/{{ item.path | dirname }}"
    owner: "{{ docker_compose_generator_uid }}"
    group: "{{ docker_compose_generator_gid }}"
    state: directory
  loop: "{{ SERVICES_ENCRYPTED_FILES }}"
  when: item.service_host == inventory_hostname

- name: Copy encrypted service files to destination
  ansible.builtin.copy:
    dest: "{{ appdata_path }}/{{ item.path }}"
    content: "{{ item.content }}"
    owner: "{{ docker_compose_generator_uid }}"
    group: "{{ docker_compose_generator_gid }}"
  loop: "{{ SERVICES_ENCRYPTED_FILES }}"
  when: item.service_host == inventory_hostname
